name: Vagrant Lint

on:
  push:
    branches: &branch_patterns ["main", "feat*"]
  pull_request:
    branches: *branch_patterns

env:
  VAGRANT_VERSION: "2.4.9"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4
      # Install
      - name: Setup Vagrant
        run: scripts/install_vagrant.sh $VAGRANT_VERSION
      # Validate
      - name: Validate Vagrantfile
        working-directory: infra/local
        run: vagrant validate
