name: Vagrant Lint

on:
  push:
    branches: &branch_patterns ["main", "feat*"]
  pull_request:
    branches: *branch_patterns

env:
  VAGRANT_VERSION: "2.4.9"
  VIRTUALBOX_VERSION: "7.2"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v5
      # Install virtualbox
      - name: Setup virtualbox
        run: .github/scripts/install_virtualbox.sh $VIRTUALBOX_VERSION
      # Install Vagrant
      - name: Setup Vagrant
        run: .github/scripts/install_vagrant.sh $VAGRANT_VERSION
      # Validate
      - name: Validate Vagrantfile
        working-directory: infra/local
        run: vagrant validate
