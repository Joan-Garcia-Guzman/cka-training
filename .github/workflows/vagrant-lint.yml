name: Vagrant Lint

on:
  push:
    branches: &branch_patterns ["main", "feat*"]
  pull_request:
    branches: *branch_patterns

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4
      # Install
      - name: Setup Vagrant
        uses: bcomnes/setup-vagrant@v3
        with:
          version: "2.4.9"
      # Validate
      - name: Validate Vagrantfile
        run: vagrant validate
